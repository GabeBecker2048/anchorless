# Anchorless configuration.
#
# Copy this to config.toml and change what you like. Every setting is optional:
# anything left out uses the default shown here.
#
# Any setting can also come from the environment as ANCHORLESS__<SECTION>__<KEY>,
# e.g. ANCHORLESS__LOCATION__CITY=Springfield. Use that for anything personal
# (like your location) so this file can be shared.

[channel]
name = "NEWS"                 # shown in the logo and in your TV guide
number = "98"
id = "anchorless.news"        # XMLTV channel id
timezone = "America/Chicago"  # for the on-screen clock and the guide
guide_title = "Anchorless News"
guide_description = "Around-the-clock headlines from national and world news outlets."

[location]
# For local news (coming soon). Best set from the environment instead:
# city = "Springfield"
# region = "IL"
# country = "US"

[video]
width = 854
height = 480
fps = 24
encoder = "x264"              # "x264" (CPU) or "vaapi" (Intel/AMD GPU)
vaapi_device = "/dev/dri/renderD128"
vaapi_rc = "vbr"              # "cqp" for older Intel GPUs (i965 driver) that reject bitrates
vaapi_qp = 24                 # quality for "cqp" (lower = better)
bitrate = "1500k"
maxrate = "2000k"
gop_seconds = 2               # a keyframe every 2 s: how fast a joining viewer can start
x264_preset = "veryfast"
x264_threads = 0              # 0 = automatic

[audio]
music_dir = "/music"          # background music (.mp3), shuffled; missing folder = silence
volume = 0.5
bitrate = "128k"

[stream]
host = "0.0.0.0"
port = 9798
lead_seconds = 10             # rendered ahead for a new viewer (Samsung TVs buffer ~10 s)
idle_seconds = 60             # stop encoding this long after the last viewer leaves

[rundown]
refresh_minutes = 10          # how often the sources are fetched
page_seconds = 12             # how long each story stays on screen
intro_seconds = 5             # segment title card (0 = none)
transition_seconds = 0.4      # crossfade between pages (0 = cut)
max_story_age_hours = 12
same_story_similarity = 0.5   # headline overlap that makes two items the same story
same_story_text_similarity = 0.32

# The newscast: segments play in order, then it loops. A story appears in the
# first segment it fits and nowhere else. Leave out scope/category to take any story.
[[rundown.segment]]
name = "TOP STORIES"
stories = 4

[[rundown.segment]]
name = "NATIONAL"
stories = 3
scope = "national"            # local | national | world

[[rundown.segment]]
name = "WORLD"
stories = 3
scope = "world"

[[rundown.segment]]
name = "BUSINESS"
stories = 2
category = "business"

[breaking]
enabled = true
min_sources = 4               # outlets that must carry a story...
window_minutes = 30           # ...within this long of its first appearance
cooldown_minutes = 20         # at most one alert per this long
crawl_tag_minutes = 60        # how long it keeps the red BREAKING tag in the crawl
title_prefixes = ["BREAKING:", "BREAKING NEWS:"]

[theme]
name = "studio"               # "studio" (pixel-art news set) or "classic" (cable-news pages)
crawl_label = "HEADLINES"
crawl_speed = 96              # pixels per second at 480 lines

# More channels from the same news (one fetch feeds them all), e.g. the
# Classic look on its own channel number. Each one gets its own stream.
# [[extra_channel]]
# name = "NEWS CLASSIC"
# number = "97"
# id = "anchorless.classic"
# theme = "classic"

[data]
dir = "data"                  # SQLite memory of stories already seen

# Sources. Listing any [[source]] replaces the built-in list entirely.
# Feeds with the same name count as one outlet. scope: local | national | world.
# exclude: regular expressions; matching headlines or links are skipped.
