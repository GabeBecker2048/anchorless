# Anchorless configuration.
#
# Copy this to config.toml and change what you like. In [channel], theme and
# show_on are required (and channel_number for a TV channel); every other
# setting is optional, and anything left out uses the default shown here.
#
# Any setting can also come from the environment as ANCHORLESS__<SECTION>__<KEY>,
# e.g. ANCHORLESS__LOCATION__CITY=Springfield. Use that for anything personal
# (like your location) so this file can be shared.

[channel]
theme = "studio"              # required: "studio" (pixel-art news set) or "classic" (cable-news pages)
name = "NEWS"                 # shown in the logo and in your TV guide (default "NEWS")
show_on = "both"              # required: "both" (TV + web page), "tv" (TV only) or "web" (web page only)
channel_number = 101          # required for "both" and "tv" (e.g. 2, 101, 2.1); ignored for "web"
# id = "anchorless.news"      # stable id for TV guides (tvg-id) and the stream URL
timezone = "America/Chicago"  # for the on-screen clock and the guide
guide_title = "Anchorless News"
guide_description = "Around-the-clock headlines from national and world news outlets."
guide_slot_minutes = 30        # guide blocks on :00/:30; 1440 = one per day

[location]
# Local news. Best set from the environment instead (ANCHORLESS__LOCATION__CITY=...),
# so this file names no place:
# city = "Springfield"        # the local segment's title
# sources_file = "local.toml" # your local outlets' feeds (see local.example.toml),
#                             # relative to this file. No file = no local segment.

[video]
width = 854
height = 480
fps = 24
encoder = "x264"              # "x264" (CPU) or "vaapi" (Intel/AMD GPU)
vaapi_device = "/dev/dri/renderD128"
vaapi_rc = "vbr"              # "cqp" for older Intel GPUs (i965 driver) that reject bitrates
vaapi_qp = 24                 # quality for "cqp" (lower = better)
vaapi_convert = "cpu"         # "gpu" converts colours on the GPU too (less CPU; newer Intel drivers)
bitrate = "1500k"
maxrate = "2000k"
gop_seconds = 2               # a keyframe every 2 s: how fast a joining viewer can start
x264_preset = "veryfast"
x264_threads = 0              # 0 = automatic

[audio]
music_dir = "/music"          # background music (.mp3), shuffled; missing folder = silence
volume = 0.5
bitrate = "128k"

[stream]
host = "0.0.0.0"
port = 9798
lead_seconds = 10             # rendered ahead for a new viewer (Samsung TVs buffer ~10 s)
idle_seconds = 60             # stop encoding this long after the last viewer leaves

[rundown]
refresh_minutes = 10          # how often the sources are fetched
page_seconds = 12             # how long each story stays on screen
intro_seconds = 5             # segment title card (0 = none)
transition_seconds = 0.4      # crossfade between pages (0 = cut)
max_story_age_hours = 12
same_story_similarity = 0.5   # headline overlap that makes two items the same story
same_story_text_similarity = 0.32

# The newscast: segments play in order, then it loops. A story appears in the
# first segment it fits and nowhere else. Leave out scope/category to take any story.
[[rundown.segment]]
name = "TOP STORIES"
stories = 4
exclude_scope = ["local"]     # local-only stories stay in the local segment

[[rundown.segment]]
name = "{city}"                # the local segment, titled with [location] city
stories = 3
scope = "local"

[[rundown.segment]]
name = "NATIONAL"
stories = 3
scope = "national"            # local | national | world

[[rundown.segment]]
name = "WORLD"
stories = 3
scope = "world"

[[rundown.segment]]
name = "BUSINESS"
stories = 2
category = "business"

[breaking]
enabled = true
min_sources = 4               # outlets that must carry a story...
window_minutes = 30           # ...within this long of its first appearance
cooldown_minutes = 20         # at most one alert per this long
crawl_tag_minutes = 60        # how long it keeps the red BREAKING tag in the crawl
title_prefixes = ["BREAKING:", "BREAKING NEWS:"]
local_min_sources = 5         # a story only local outlets carry needs this many
local_alerts = "on"           # "on", "log" (only log what would break in), or "off"
sound = "auto"                # "auto", "chiptune", "news", "none", or a sound file's path
sound_volume = 0.8            # the music ducks under it either way

[theme]                       # shared by every channel's look
crawl_label = "HEADLINES"
crawl_speed = 96              # pixels per second at 480 lines

# More channels from the same news (one fetch feeds them all). The settings are
# the same as [channel], except that name is required here. Each channel gets its
# own stream, drawn and encoded only while someone watches it. Add as many as you like.
#
# [[extra_channel]]
# theme = "classic"
# name = "NEWS CLASSIC"       # required for an extra channel
# show_on = "web"
# channel_number = 99         # ignored: show_on is "web"
#
# [[extra_channel]]
# theme = "studio"
# name = "NEWS 2"
# show_on = "tv"
# channel_number = 102

[data]
dir = "data"                  # SQLite memory of stories already seen

# Sources. Listing any [[source]] replaces the built-in list entirely.
# Feeds with the same name count as one outlet. scope: local | national | world.
# exclude: regular expressions; matching headlines or links are skipped.
