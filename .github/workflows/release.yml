name: release

# Pushing a tag vX.Y.Z (scripts/release.sh does it) publishes that version:
# the container image to ghcr.io and a GitHub release with its CHANGELOG entry.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # create the GitHub release
      packages: write      # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the tag matches pyproject.toml and has a CHANGELOG entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^version = \"${version}\"$" pyproject.toml \
            || { echo "::error::tag ${GITHUB_REF_NAME} doesn't match the version in pyproject.toml"; exit 1; }
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          test -s notes.md || { echo "::error::no '## ${version}' section in CHANGELOG.md"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anchorless
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "anchorless ${VERSION}" --notes-file notes.md --verify-tag
