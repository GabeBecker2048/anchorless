name: release

# Pushing a tag vX.Y.Z (scripts/release.sh does it) publishes that version: the
# package to PyPI, the container image to ghcr.io, and a GitHub release with its
# CHANGELOG entry. No tokens: PyPI trusts this workflow (trusted publishing).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The tag matches pyproject.toml and has a CHANGELOG entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^version = \"${version}\"$" pyproject.toml \
            || { echo "::error::tag ${GITHUB_REF_NAME} doesn't match the version in pyproject.toml"; exit 1; }
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          test -s notes.md || { echo "::error::no '## ${version}' section in CHANGELOG.md"; exit 1; }
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  pypi:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/anchorless/
    permissions:
      id-token: write      # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write      # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Re-running an older tag (or re-pushing every tag at once) must not move the
      # floating tags backwards: on 2026-11-05 a re-run of v1.0.0 finished last and
      # pointed :1, :1.0 and :latest at 1.0.0, and the server's nightly autopatch
      # downgraded to it. Only the highest released version gets them.
      - id: newest
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          newest="$(git ls-remote --tags --refs "$REPO_URL" 'v*.*.*' \
            | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1)"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "floating=true" >> "$GITHUB_OUTPUT"
          else
            echo "floating=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${GITHUB_REF_NAME} is not the newest release (${newest}); pushing only :${GITHUB_REF_NAME#v}"
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gabebecker2048/anchorless   # lowercase: image names must be
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}},enable=${{ steps.newest.outputs.floating }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.newest.outputs.floating }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.floating }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [pypi, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write      # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "anchorless ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
