name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  # The container image builds (amd64 only here; releases also build arm64).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: anchorless:ci
          load: true
      - name: The image ships no build tools, only the app
        run: |
          docker run --rm --entrypoint sh anchorless:ci -c '! command -v uv && test ! -d /app/src && anchorless --version'
          docker image ls anchorless:ci --format 'image size: {{.Size}}'
      - name: The compose file's first start writes a config and serves
        run: |
          mkdir -p /tmp/ci/config /tmp/ci/data && cd /tmp/ci
          sed 's|ghcr.io/gabebecker2048/anchorless:latest|anchorless:ci|; s|"1000:1000"|"'"$(id -u):$(id -g)"'"|' \
            "$GITHUB_WORKSPACE/deploy/docker-compose.example.yml" > docker-compose.yml
          docker compose up -d
          for i in $(seq 30); do curl -fsS localhost:9798/health && break; sleep 2; done
          test -s config/config.toml && test -s data/anchorless.sqlite3 -o -d data
          curl -fsS localhost:9798/playlist.m3u | grep -q live.ts
          docker compose logs
          docker compose down

  # A single check for branch protection to require, so the rule doesn't have to
  # name every matrix job.
  all-green:
    needs: [test, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success" && test "${{ needs.docker.result }}" = "success"
