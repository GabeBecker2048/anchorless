<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchorless Settings</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23141b3d'/%3E%3Ccircle cx='8' cy='8' r='4' fill='none' stroke='%23ffd34d' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/settings.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">ANCHORLESS</div>
    <div class="tag">Settings</div>
    <div class="spacer"></div>
    <a class="pill" href="/">◀ WATCH</a>
    <button class="pill plain" id="logout" hidden>LOG OUT</button>
  </header>

  <div id="state"></div>
  <div id="main" hidden>
    <p class="page-note" id="where"></p>
    <div id="banner"></div>
    <div class="card"><h2>CHANNELS</h2>
      <p class="page-note" id="look-note"></p>
      <div class="rows" id="channels"></div>
      <div class="gap-top"><button class="btn small" id="add-channel">+ ADD CHANNEL</button></div></div>
    <div id="sections"></div>
    <div class="card"><h2>RECENT CHANGES <span class="sub">saved here or made in the file</span></h2><div id="history"></div></div>
    <div class="card"><h2>FILE ONLY <span class="sub">change these in the file, then they apply on restart</span></h2><div id="fileonly"></div></div>
    <div class="savebar" id="savebar">
      <div class="sum" id="sum"></div>
      <div class="apply" id="apply"></div>
      <button class="btn" id="discard">DISCARD</button>
      <button class="btn primary" id="save">SAVE</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="/assets/settings.js"></script>
</body>
</html>
