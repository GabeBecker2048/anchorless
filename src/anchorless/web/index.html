<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchorless</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23141b3d'/%3E%3Crect x='3' y='4' width='10' height='6' fill='%234fd8e8'/%3E%3Crect x='2' y='11' width='12' height='2' fill='%23ffd34d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">ANCHORLESS</div>
    <div class="tag">News without the anchor</div>
    <div class="spacer"></div>
    <select id="channel" aria-label="Channel" hidden></select>
    <span class="pill" id="conn">connecting…</span>
    <a class="pill" href="/settings" title="Settings">⚙ SETTINGS</a>
  </header>

  <div class="player" id="player">
    <img class="poster" id="poster" alt="">
    <video id="video" playsinline></video>
    <button class="big-play" id="bigplay" aria-label="Watch live">
      <span class="btn">▶ WATCH LIVE</span>
      <span class="hint" id="bighint">starts the channel - about 2 s</span>
    </button>
    <div class="status-msg" id="msg">TUNING IN…</div>
    <div class="controls" id="controls">
      <button id="stop" title="Stop (K)" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg></button>
      <button id="mute" title="Mute (M)" aria-label="Mute"><svg viewBox="0 0 24 24" id="muteicon"></svg></button>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <span class="badge">LIVE</span>
      <span class="now" id="nowline"></span>
      <button id="fs" title="Full screen (F)" aria-label="Full screen"><svg viewBox="0 0 24 24" id="fsicon"></svg></button>
    </div>
  </div>
  <div class="keys"><kbd>Space</kbd> watch / stop · <kbd>F</kbd> full screen (or double-click) · <kbd>M</kbd> mute · <kbd>↑</kbd><kbd>↓</kbd> volume</div>

  <div class="grid">
    <div class="card">
      <h2>RUNDOWN <span class="sub" id="rd-sub"></span></h2>
      <div id="rundown"><div class="empty">Loading…</div></div>
    </div>
    <div class="stack">
      <div class="card">
        <h2>ON AIR</h2>
        <dl class="kv" id="onair"></dl>
      </div>
      <div class="card">
        <h2>BREAKING ALERTS <span class="sub" id="br-sub"></span></h2>
        <div id="alerts"></div>
      </div>
      <div class="card">
        <h2>FEEDS <span class="sub" id="feeds-sub"></span></h2>
        <div id="feeds"></div>
      </div>
    </div>
  </div>

  <footer>
    <span id="ver"></span>
    <a href="/playlist.m3u">playlist.m3u</a>
    <a href="/guide.xml">guide.xml</a>
    <a href="/health">health</a>
  </footer>
</div>

<script src="/static/mpegts.min.js"></script>
<script src="/assets/viewer.js"></script>
</body>
</html>
