[project]
name = "anchorless"
version = "0.1.0"
description = "A 24/7 text newscast for IPTV: headlines in, MPEG-TS out. News without the anchor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pillow>=11.0",
    "pydantic>=2.8",
    "tomlkit>=0.15.2",
]

[project.scripts]
anchorless = "anchorless.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anchorless"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905"]   # long lines are fine; word lists read better as split strings

[tool.pytest.ini_options]
testpaths = ["tests"]
