[project]
name = "anchorless"
version = "1.0.0"
description = "A 24/7 text newscast for IPTV: headlines in, MPEG-TS out. News without the anchor."
dynamic = ["readme"]
license = "MIT"
authors = [{ name = "Gabe Becker" }]
keywords = ["news", "iptv", "jellyfin", "plex", "rss", "tv", "pixel-art", "self-hosted"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pillow>=11.0",
    "pydantic>=2.8",
    "tomlkit>=0.15.2",
]

[project.urls]
Homepage = "https://github.com/GabeBecker2048/anchorless"
Changelog = "https://github.com/GabeBecker2048/anchorless/blob/main/CHANGELOG.md"
Issues = "https://github.com/GabeBecker2048/anchorless/issues"

[project.scripts]
anchorless = "anchorless.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# PyPI shows the README, but can't follow its relative links and images:
# make them absolute there. (On GitHub they stay relative, which works.)
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(docs/studio\.gif\)'
replacement = '](https://raw.githubusercontent.com/GabeBecker2048/anchorless/main/docs/studio.gif)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/GabeBecker2048/anchorless/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/anchorless"]

# The examples live at the top of the repo, and inside the package for `anchorless init`.
[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "anchorless/config.example.toml"
"local.example.toml" = "anchorless/local.example.toml"

[tool.hatch.build.targets.sdist]
exclude = ["/docs/*.gif", "/.github", "/deploy"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905"]   # long lines are fine; word lists read better as split strings

[tool.pytest.ini_options]
testpaths = ["tests"]
