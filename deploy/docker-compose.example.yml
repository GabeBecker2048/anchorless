# Example: Anchorless with Intel/AMD hardware encoding.
# Put your settings in config/config.toml next to this file, and anything personal
# (like your location, and the settings page's password) in .env:
#   ANCHORLESS__LOCATION__CITY=...
#   ANCHORLESS__ADMIN__PASSWORD=<long random>
# The config folder is writable so the settings page (/settings) can save to it;
# mount the folder, not the file (a save replaces the file).
services:
  anchorless:
    build: ..                      # or: image: <your registry>/anchorless
    container_name: anchorless
    restart: unless-stopped
    user: "1000:1000"              # owner of ./data on the host
    ports:
      - "9798:9798"
    env_file: .env
    environment:
      ANCHORLESS_CONFIG: /config/config.toml
      ANCHORLESS__VIDEO__ENCODER: vaapi
    volumes:
      - ./config:/config                 # config.toml (+ local.toml): read-write
      - ./data:/data
      - /path/to/music:/music:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"                      # the host's render group id: getent group render
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
